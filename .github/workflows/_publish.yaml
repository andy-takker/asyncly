name: Publish Python distribution

on:
  workflow_call:
    inputs:
      version:
        description: Stable release version
        required: true
        type: string

permissions: {}

jobs:
  provenance:
    name: Attest package provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the provenance attestation.
      attestations: write # Publish build provenance.
    steps:
      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-dist
          path: dist/

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  publish-to-pypi:
    name: Publish distribution to PyPI
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # Authenticate to PyPI with trusted publishing.
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          checksum: "8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b"
          python-version: "3.10"
          enable-cache: false

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-dist
          path: dist/

      - name: Validate release artifacts
        run: >-
          uv run python -m tools.release artifacts
          --version "${RELEASE_VERSION}"
          --directory dist
          --output dist/SHA256SUMS.json

      - name: Publish distribution to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/ \
            dist/*.whl dist/*.tar.gz

  github-release:
    name: Sign artifacts and create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the GitHub Release.
      id-token: write # Sign artifacts with Sigstore.
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          checksum: "8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b"
          python-version: "3.10"
          enable-cache: false

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-dist
          path: dist/

      - name: Validate release artifacts
        run: >-
          uv run python -m tools.release artifacts
          --version "${RELEASE_VERSION}"
          --directory dist
          --output dist/SHA256SUMS.json

      - name: Generate release notes
        run: >-
          uv run python -m tools.release notes
          --version "${RELEASE_VERSION}"
          --changelog CHANGELOG.md
          --output release-notes.md

      - name: Sign release artifacts
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: >-
            dist/*.whl
            dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/*
